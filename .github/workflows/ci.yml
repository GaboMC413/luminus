name: CI

on:
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Tests y Builds
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm run test:platform

      - name: Build de Marketing
        run: npm run build -w marketing

      - name: Build de Plataforma
        run: npm run build -w platform

  security:
    name: Auditoría de seguridad
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Clonar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar vulnerabilidades
        run: npm audit --omit=dev
