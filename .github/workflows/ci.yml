name: CI

on:
  pull_request:
    branches: [ "main", "platform/dev" ]

jobs:
  test:
    name: Correr Tests y Validaciones
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependencias
      run: npm install

    - name: Generar Prisma Client
      run: npm run db:generate -w platform

    - name: Verificar TypeScript
      run: npx --prefix apps/platform tsc --noEmit -p apps/platform/tsconfig.json

    - name: Ejecutar los tests
      run: npm run test:platform
