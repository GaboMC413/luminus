version: 1
applications:
  - appRoot: apps/platform
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../..
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - node ../../scripts/generate-env.js .env.production
            - cd ../..
            - npm run db:generate -w platform
            - npm run db:push -w platform
            - npm run db:seed:interests -w platform
            - npm run build:platform
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ../../.npm/**/*
          - ../../node_modules/**/*

  - appRoot: apps/marketing
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../..
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - node ../../scripts/generate-env.js .env.production
            - cd ../..
            - npm run db:generate -w platform
            - npm run build:marketing
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ../../.npm/**/*
          - ../../node_modules/**/*
