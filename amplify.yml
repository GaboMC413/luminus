version: 1
applications:
  - appRoot: apps/platform
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../..
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - env | grep -E '^(DATABASE_URL|AUTH_|GOOGLE_|COGNITO_|S3_|SES_|EVENT_|ENABLE_|SKIP_)' > apps/platform/.env.production
            - npm run db:generate -w platform
            - npm run build:platform
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ../../.npm/**/*
          - ../../node_modules/**/*

  - appRoot: apps/marketing
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../..
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - env | grep -E '^(DATABASE_URL|AUTH_|GOOGLE_|COGNITO_|S3_|SES_|EVENT_|ENABLE_|SKIP_)' > apps/marketing/.env.production
            - npm run db:generate -w platform
            - npm run build:marketing
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ../../.npm/**/*
          - ../../node_modules/**/*
