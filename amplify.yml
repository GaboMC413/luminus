version: 1
applications:
  - appRoot: apps/platform
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../..
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - npm run build:platform
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ../../.npm/**/*
          - ../../node_modules/**/*