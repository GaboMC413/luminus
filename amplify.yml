version: 1
applications:
  - appRoot: apps/platform
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22 || nvm install 22
            - cd ../..
            - npm ci --cache .npm --prefer-offline --no-audit
        build:
          commands:
            - printf "DATABASE_URL=%s\nAUTH_SESSION_SECRET=%s\nAUTH_BASE_URL=%s\nGOOGLE_CLIENT_ID=%s\nGOOGLE_CLIENT_SECRET=%s\nCOGNITO_DOMAIN=%s\nCOGNITO_REGION=%s\nCOGNITO_CLIENT_ID=%s\nCOGNITO_CLIENT_SECRET=%s\nCOGNITO_USER_POOL_ID=%s\nCOGNITO_ADMIN_ACCESS_KEY_ID=%s\nCOGNITO_ADMIN_SECRET_ACCESS_KEY=%s\nNEXT_PUBLIC_GOOGLE_MAPS_API_KEY=%s\nS3_STORAGE_BUCKET=%s\nS3_STORAGE_REGION=%s\nS3_STORAGE_PUBLIC_BASE_URL=%s\nS3_STORAGE_ACCESS_KEY_ID=%s\nS3_STORAGE_SECRET_ACCESS_KEY=%s\nSES_REGION=%s\nSES_FROM_EMAIL=%s\nEVENT_FROM_EMAIL=%s\nSES_ACCESS_KEY_ID=%s\nSES_SECRET_ACCESS_KEY=%s\nCONTACT_NOTIFICATION_EMAILS=%s\nENABLE_RUNTIME_DEBUG=%s\nSKIP_EMAIL_VERIFICATION=%s\nNEXT_PUBLIC_TURNSTILE_SITE_KEY=%s\nTURNSTILE_SECRET_KEY=%s\nSTRIPE_SECRET_KEY=%s\nNEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=%s\nSTRIPE_PRICE_ID_MONTHLY_5=%s\nSTRIPE_PRICE_ID_ANNUAL_45=%s\nSTRIPE_WEBHOOK_SECRET=%s\nCRON_SECRET=%s\n" "$DATABASE_URL" "$AUTH_SESSION_SECRET" "$AUTH_BASE_URL" "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" "$COGNITO_DOMAIN" "$COGNITO_REGION" "$COGNITO_CLIENT_ID" "$COGNITO_CLIENT_SECRET" "$COGNITO_USER_POOL_ID" "$COGNITO_ADMIN_ACCESS_KEY_ID" "$COGNITO_ADMIN_SECRET_ACCESS_KEY" "$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY" "$S3_STORAGE_BUCKET" "$S3_STORAGE_REGION" "$S3_STORAGE_PUBLIC_BASE_URL" "$S3_STORAGE_ACCESS_KEY_ID" "$S3_STORAGE_SECRET_ACCESS_KEY" "$SES_REGION" "$SES_FROM_EMAIL" "$EVENT_FROM_EMAIL" "$SES_ACCESS_KEY_ID" "$SES_SECRET_ACCESS_KEY" "$CONTACT_NOTIFICATION_EMAILS" "$ENABLE_RUNTIME_DEBUG" "$SKIP_EMAIL_VERIFICATION" "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" "$TURNSTILE_SECRET_KEY" "$STRIPE_SECRET_KEY" "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" "$STRIPE_PRICE_ID_MONTHLY_5" "$STRIPE_PRICE_ID_ANNUAL_45" "$STRIPE_WEBHOOK_SECRET" "$CRON_SECRET" > apps/platform/.env.production
            - npm run db:generate -w platform
            - npm run db:deploy -w platform
            - npm run build:platform
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ../../.npm/**/*
          - ../../node_modules/**/*

  - appRoot: apps/marketing
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22 || nvm install 22
            - cd ../..
            - npm ci --cache .npm --prefer-offline --no-audit
        build:
          commands:
            - printf "DATABASE_URL=%s\nUNSUBSCRIBE_SECRET=%s\nNEXT_PUBLIC_GOOGLE_MAPS_API_KEY=%s\nSES_REGION=%s\nSES_FROM_EMAIL=%s\nEVENT_FROM_EMAIL=%s\nSES_ACCESS_KEY_ID=%s\nSES_SECRET_ACCESS_KEY=%s\nCONTACT_NOTIFICATION_EMAILS=%s\nENABLE_RUNTIME_DEBUG=%s\nNEXT_PUBLIC_TURNSTILE_SITE_KEY=%s\nTURNSTILE_SECRET_KEY=%s\nAWS_SNS_SES_TOPIC_ARN=%s\n" "$DATABASE_URL" "$UNSUBSCRIBE_SECRET" "$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY" "$SES_REGION" "$SES_FROM_EMAIL" "$EVENT_FROM_EMAIL" "$SES_ACCESS_KEY_ID" "$SES_SECRET_ACCESS_KEY" "$CONTACT_NOTIFICATION_EMAILS" "$ENABLE_RUNTIME_DEBUG" "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" "$TURNSTILE_SECRET_KEY" "$AWS_SNS_SES_TOPIC_ARN" > apps/marketing/.env.production
            - npm run db:generate -w platform
            - npm run build:marketing
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ../../.npm/**/*
          - ../../node_modules/**/*
