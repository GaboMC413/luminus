version: 1
applications:
  - appRoot: apps/platform
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../..
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - npm run build:platform
      artifacts:
        baseDirectory: apps/platform/.next
        files:
          - '**/*'
      cache:
        paths:
          - apps/platform/.next/cache/**/*
          - .npm/**/*
          - node_modules/**/*