version: 1
applications:
  - appRoot: apps/platform
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm ci --cache .npm --prefer-offline
        build:
          commands:
            - echo "PWD START: $(pwd)"
            - cd ../.. && echo "PWD AFTER CD: $(pwd)" && (ls -la scripts/ || true) && (node scripts/generate-env.js apps/platform/.env.production || true)
            - cd ../.. && npm run db:generate -w platform && npm run build:platform
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ../../.npm/**/*
          - ../../node_modules/**/*

  - appRoot: apps/marketing
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm ci --cache .npm --prefer-offline
        build:
          commands:
            - echo "PWD START: $(pwd)"
            - cd ../.. && echo "PWD AFTER CD: $(pwd)" && (ls -la scripts/ || true) && (node scripts/generate-env.js apps/marketing/.env.production || true)
            - cd ../.. && npm run db:generate -w platform && npm run build:marketing
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ../../.npm/**/*
          - ../../node_modules/**/*
